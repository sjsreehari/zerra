# Zerra Docker Compose Stack
# ─────────────────────────────────────────────────────────────────────────────
# Quick start:
#   docker compose up -d
#   open http://localhost:3000
#
# Services:
#   - inference : Zerra Agent (FastAPI / Python) — scanner, fix & PR engine on :8000
#   - dashboard : Zerra Dashboard (Next.js) on :3000
# ─────────────────────────────────────────────────────────────────────────────

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Zerra Agent / Inference Engine ──────────────────────────────────────────
  # The core scanner, AST engine, fix generator, and auto-PR opener.
  inference:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ${ZERRA_INFERENCE_IMAGE:-ghcr.io/sjsreehari/zerra-inference}:${ZERRA_VERSION:-latest}
    <<: [*restart, *logging]
    ports:
      - "${ZERRA_INFERENCE_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-20240307}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ZERRA_VAULT_KEY: ${ZERRA_VAULT_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zerra_vault:/root/.zerra
      # Docker socket so the agent can create isolated sandbox containers for verification
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Zerra Dashboard (Next.js) ───────────────────────────────────────────────
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ZERRA_URL: ${NEXT_PUBLIC_ZERRA_URL:-http://localhost:8000}
    image: ${ZERRA_DASHBOARD_IMAGE:-ghcr.io/sjsreehari/zerra-dashboard}:${ZERRA_VERSION:-latest}
    <<: [*restart, *logging]
    ports:
      - "${ZERRA_DASHBOARD_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_ZERRA_URL: ${NEXT_PUBLIC_ZERRA_URL:-http://localhost:8000}
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  zerra_vault:
    name: zerra_vault_data
