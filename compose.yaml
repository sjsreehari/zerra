services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  inference:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports: ["8000:8000"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  upstream:
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: ["python", "-m", "uvicorn", "agent.upstream_api:app", "--host", "0.0.0.0", "--port", "8001"]
    expose: ["8001"]

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_CONN_STR: ${DB_CONN_STR}
      SENTRA_INFERENCE_URL: ${SENTRA_INFERENCE_URL}
      SENTRA_INFERENCE_ENABLED: ${SENTRA_INFERENCE_ENABLED}
      BASE_DOMAIN: ${BASE_DOMAIN}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports: ["8080:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      inference: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRA_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["3000:3000"]
    depends_on:
      - inference
    profiles: ["frontend"]
