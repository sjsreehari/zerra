name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ─── Build & push Docker images ───────────────────────────────────────────
  docker-publish:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: agent/Dockerfile
            image: ghcr.io/sjsreehari/zerra-inference
            platforms: linux/amd64,linux/arm64
          - context: ./frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/sjsreehari/zerra-dashboard
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Publish CLI to npm ────────────────────────────────────────────────────
  npm-publish:
    name: CLI — Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build -w cli

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" -w cli --no-git-tag-version

      - name: Publish @zerra/cli to npm
        run: npm publish -w cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Create GitHub Release with install instructions ──────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-publish, npm-publish]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create release notes
        id: notes
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## Zerra ${{ github.ref_name }}

          Local-first blue-team security platform — runs entirely on your machine.

          ### Quick Start (One Line)

          **macOS / Linux:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/sjsreehari/zerra/${{ github.ref_name }}/install.sh | bash
          ```

          **Windows (PowerShell as Administrator):**
          ```powershell
          irm https://raw.githubusercontent.com/sjsreehari/zerra/${{ github.ref_name }}/install.ps1 | iex
          ```

          **npm (Node.js 18+):**
          ```bash
          npm install -g @zerra/cli@${{ steps.version.outputs.version }}
          zerra init
          ```

          **Docker Compose (manual):**
          ```bash
          git clone https://github.com/sjsreehari/zerra
          cd zerra
          cp .env.example .env
          # Edit .env — set JWT_SECRET to a random 32-char string
          docker compose up -d
          # Open http://localhost:3000
          ```

          ### Requirements
          - Docker Desktop 4.x+ (or Docker Engine + Compose v2)
          - 4 GB RAM minimum (8 GB recommended)
          - macOS 12+, Ubuntu 20.04+, Windows 10/11

          ### What's in this release
          See [CHANGELOG.md](https://github.com/sjsreehari/zerra/blob/main/CHANGELOG.md) for details.

          ### Docker Images
          | Image | Tag |
          |---|---|
          | `ghcr.io/sjsreehari/zerra-inference` | `${{ steps.version.outputs.version }}` |
          | `ghcr.io/sjsreehari/zerra-gateway` | `${{ steps.version.outputs.version }}` |
          | `ghcr.io/sjsreehari/zerra-dashboard` | `${{ steps.version.outputs.version }}` |
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            install.sh
            install.ps1
            compose.yaml
            .env.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
