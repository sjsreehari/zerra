name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TypeScript / Node.js ───────────────────────────────────────────────────
  ts-lint-typecheck:
    name: TS Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck all workspaces
        run: npx tsc --noEmit

  ts-unit-tests:
    name: TS Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: ts-lint-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test:unit

  # ─── Next.js Frontend ──────────────────────────────────────────────────────
  frontend-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build

  # ─── Python AI Agent ──────────────────────────────────────────────────────
  python-tests:
    name: Python Agent Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          cd agent
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: cd agent && pytest tests/ -v --tb=short

  # ─── Go Scanner Worker ────────────────────────────────────────────────────
  go-tests:
    name: Go Scanner Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        run: cd backend && go test ./... -v -race -timeout 120s

      - name: Go vet
        run: cd backend && go vet ./...
