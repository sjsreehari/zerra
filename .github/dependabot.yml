version: 2
updates:
  # Node.js / npm (monorepo root + all workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    labels:
      - "area: infra"
      - "chore"

  # Python (agent)
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    labels:
      - "area: agent"
      - "chore"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
    labels:
      - "area: infra"
      - "chore"
